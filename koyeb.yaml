name: llm-api

services:
  - name: api
    git:
      repository: github.com/Yahia995/llm-api
      branch: main
    dockerfile: Dockerfile
    instance_type: nano
    ports:
      - port: 8000
        protocol: http
    env:
      - key: GROQ_API_KEY
        secret: GROQ_API_KEY
      - key: GROQ_MODEL
        value: llama3-8b-8192
      - key: REDIS_URL
        secret: REDIS_URL
      - key: MLFLOW_TRACKING_URI
        value: http://mlflow.llm-api.koyeb.app
    health_checks:
      - path: /health
        port: 8000
        protocol: http

  - name: worker
    git:
      repository: github.com/Yahia995/llm-api
      branch: main
    dockerfile: Dockerfile
    run_command: celery -A app.celery_worker worker --pool=solo --loglevel=info
    instance_type: nano
    env:
      - key: GROQ_API_KEY
        secret: GROQ_API_KEY
      - key: GROQ_MODEL
        value: llama3-8b-8192
      - key: REDIS_URL
        secret: REDIS_URL
      - key: MLFLOW_TRACKING_URI
        value: http://mlflow.llm-api.koyeb.app

  - name: mlflow
    git:
      repository: github.com/Yahia995/llm-api
      branch: main
    dockerfile: mlflow/Dockerfile
    instance_type: nano
    ports:
      - port: 5000
        protocol: http
    env:
      - key: DATABASE_URL
        secret: DATABASE_URL
    health_checks:
      - path: /health
        port: 5000
        protocol: http
