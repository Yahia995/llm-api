services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - llm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mlflow:
    build: ./mlflow
    container_name: mlflow
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - llm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: llm_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    networks:
      - llm-network

  worker:
    build: .
    container_name: llm_worker
    command: celery -A app.celery_worker worker --pool=solo --loglevel=info
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    networks:
      - llm-network

networks:
  llm-network:
    driver: bridge
