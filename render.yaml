services:
  - type: web
    name: llm-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false 
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: REDIS_URL
        sync: false       
      - key: DATABASE_URL
        sync: false        
      - key: MLFLOW_TRACKING_URI
        value: "none"       
